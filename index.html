<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-PLAYSTOR</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#050510;
    color:white;
}

header{
    background:#0D0D1A;
    padding:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:32px;
    font-weight:bold;
    color:#B026FF;
}

nav a{
    color:white;
    text-decoration:none;
    margin-left:20px;
}

.banner{
    height:400px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:50px;
    background:linear-gradient(
    rgba(0,0,0,.5),
    rgba(0,0,0,.8)),
    url('https://images.unsplash.com/photo-1542751371-adc38448a05e');
    background-size:cover;
}

.banner h1{
    font-size:60px;
    color:#B026FF;
}

.banner button{
    width:200px;
    padding:15px;
    margin-top:20px;
    background:#8A2BE2;
    border:none;
    color:white;
    cursor:pointer;
    border-radius:10px;
}

.jogos{
    padding:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.card{
    background:#121226;
    padding:20px;
    border-radius:15px;
}

.card img{
    width:100%;
    border-radius:10px;
}
</style>

</head>
<body>

<header>
<div class="logo">X-PLAYSTOR</div>

<nav>
<a href="#">Loja</a>
<a href="#">Biblioteca</a>
<a href="#">Comunidade</a>
<a href="#">Suporte</a>
</nav>
</header>

<section class="banner">
<h1>X-PLAYSTOR</h1>
<p>Jogos. Diversão. Sem Limites.</p>
<button>Explorar Loja</button>
</section>

<section class="jogos">
<h2>Destaques</h2>

<div class="grid">

<div class="card">
<img src="https://picsum.photos/300/180?1">
<h3>Cyber Runner</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/180?2">
<h3>Galaxy Wars</h3>
</div>

<div class="card">
<img src="https://picsum.photos/300/180?3">
<h3>Shadow Legacy</h3>
</div>

</div>
</section>

</body>
</html>
